<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="64" height="64" rx="16" fill="#06120e"/>
  
  <!-- Outer Nature Ring -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 2"/>
  
  <!-- Animal Paw Print Icon -->
  <g filter="url(#emeraldGlow)">
    <!-- Main Pad -->
    <path d="M32 32 C26 32 23 37 24 43 C25 48 30 50 32 50 C34 50 39 48 40 43 C41 37 38 32 32 32 Z" fill="url(#pawGrad)"/>
    <!-- Outer Toe Left -->
    <ellipse cx="20" cy="30" rx="3.5" ry="4.5" transform="rotate(-25 20 30)" fill="url(#pawGrad)"/>
    <!-- Inner Toe Left -->
    <ellipse cx="27" cy="22" rx="3.6" ry="5.2" transform="rotate(-10 27 22)" fill="url(#pawGrad)"/>
    <!-- Inner Toe Right -->
    <ellipse cx="37" cy="22" rx="3.6" ry="5.2" transform="rotate(10 37 22)" fill="url(#pawGrad)"/>
    <!-- Outer Toe Right -->
    <ellipse cx="44" cy="30" rx="3.5" ry="4.5" transform="rotate(25 44 30)" fill="url(#pawGrad)"/>
  </g>
</svg>
